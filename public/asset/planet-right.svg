<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 1. Fractal noise for right planet's distinct atmospheric swirling texture -->
    <filter id="planetSurfaceNoiseRight" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.007" numOctaves="3" seed="108" result="noise" />
      <feColorMatrix type="matrix" values="
        0.4 0   0   0 0.12
        0   0.3 0   0 0.10
        0   0   0.8 0 0.32
        0   0   0   0.40 0" in="noise" result="coloredNoise" />
      <feBlend in="SourceGraphic" in2="coloredNoise" mode="overlay" />
    </filter>

    <!-- 2. Soft atmospheric blur for ambient rim lighting -->
    <filter id="rimGlowFilterRight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Circular clipping for the planet body (r=210) -->
    <clipPath id="planetClipRight">
      <circle cx="250" cy="250" r="210" />
    </clipPath>

    <!-- Base Sphere Volumetric Gradient: Light coming from upper-left (cx=32%, cy=28%) -->
    <radialGradient id="baseSphereGradRight" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.9" />
      <stop offset="22%" stop-color="#4338CA" stop-opacity="1" />
      <stop offset="50%" stop-color="#312E81" stop-opacity="1" />
      <stop offset="78%" stop-color="#1E1B4B" stop-opacity="1" />
      <stop offset="100%" stop-color="#070719" stop-opacity="1" />
    </radialGradient>

    <!-- Terminator Shadow Gradient (Darkness on the lower-right side) -->
    <radialGradient id="terminatorShadowRight" cx="72%" cy="72%" r="65%">
      <stop offset="0%" stop-color="#04040F" stop-opacity="0.97" />
      <stop offset="48%" stop-color="#08081E" stop-opacity="0.82" />
      <stop offset="82%" stop-color="#121133" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#121133" stop-opacity="0" />
    </radialGradient>

    <!-- Upper-Left Crescent Rim Light Highlight (Periwinkle & Lavender, softer intensity) -->
    <radialGradient id="rimLightGradRight" cx="28%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="0.85" />
      <stop offset="15%" stop-color="#A5B4FC" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <!-- Atmospheric Edge Haze (Upper-left perimeter) -->
    <linearGradient id="edgeHazeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#818CF8" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#4338CA" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F0E2A" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Atmospheric Glow (Subtle back-glow in space) -->
    <radialGradient id="outerAtmosphereGlowRight" cx="35%" cy="32%" r="55%">
      <stop offset="65%" stop-color="#818CF8" stop-opacity="0.28" />
      <stop offset="88%" stop-color="#4F46E5" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#312E81" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Layer 1: Outer Atmospheric Back-Glow -->
  <circle cx="250" cy="250" r="224" fill="url(#outerAtmosphereGlowRight)" filter="url(#rimGlowFilterRight)" />

  <!-- Layer 2: Clipped Planet Sphere Body -->
  <g clip-path="url(#planetClipRight)">
    <!-- Base volumetric spherical fill -->
    <circle cx="250" cy="250" r="210" fill="url(#baseSphereGradRight)" />

    <!-- Atmospheric textured storm bands with fractal turbulence -->
    <rect x="40" y="40" width="420" height="420" fill="url(#baseSphereGradRight)" filter="url(#planetSurfaceNoiseRight)" opacity="0.6" />

    <!-- Secondary depth layer: inclined atmospheric flow curves -->
    <path d="M 40,180 Q 250,140 460,200 L 460,260 Q 250,200 40,240 Z" fill="#4338CA" opacity="0.25" />
    <path d="M 40,250 Q 250,210 460,270 L 460,330 Q 250,270 40,310 Z" fill="#312E81" opacity="0.3" />
    <path d="M 40,110 Q 250,80 460,130 L 460,180 Q 250,130 40,160 Z" fill="#6366F1" opacity="0.2" />

    <!-- Volumetric Terminator Shadow (Darkness on non-lit quadrant) -->
    <circle cx="250" cy="250" r="210" fill="url(#terminatorShadowRight)" />

    <!-- High-altitude crescent illumination overlay -->
    <circle cx="250" cy="250" r="210" fill="url(#rimLightGradRight)" />

    <!-- Inner limb darkening on the shadow side -->
    <circle cx="250" cy="250" r="210" fill="none" stroke="#04040F" stroke-width="24" opacity="0.75" />
  </g>

  <!-- Layer 3: Sharp lit crescent rim on the outer edge facing the light source -->
  <circle cx="250" cy="250" r="209" fill="none" stroke="url(#edgeHazeRight)" stroke-width="3.8" opacity="0.85" />
  <circle cx="250" cy="250" r="208.5" fill="none" stroke="#EEF2FF" stroke-width="1.5" stroke-dasharray="260 1060" stroke-dashoffset="360" opacity="0.9" />
</svg>
