<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- 1. Fractal noise for subtle planetary atmospheric bands & surface texture -->
    <filter id="planetSurfaceNoiseLeft" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Horizontal stretched turbulence for gas giant bands -->
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.004" numOctaves="4" seed="42" result="noise" />
      <feColorMatrix type="matrix" values="
        0.5 0   0   0 0.15
        0   0.3 0   0 0.08
        0   0   0.7 0 0.28
        0   0   0   0.45 0" in="noise" result="coloredNoise" />
      <feBlend in="SourceGraphic" in2="coloredNoise" mode="overlay" />
    </filter>

    <!-- 2. Soft atmospheric blur for ambient rim lighting -->
    <filter id="rimGlowFilterLeft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Circular clipping for the planet body -->
    <clipPath id="planetClipLeft">
      <circle cx="300" cy="300" r="260" />
    </clipPath>

    <!-- Base Sphere Volumetric Gradient: Light coming from top-right (cx=68%, cy=32%) -->
    <radialGradient id="baseSphereGradLeft" cx="68%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#581C87" stop-opacity="1" />
      <stop offset="55%" stop-color="#2E1065" stop-opacity="1" />
      <stop offset="80%" stop-color="#180B2B" stop-opacity="1" />
      <stop offset="100%" stop-color="#080312" stop-opacity="1" />
    </radialGradient>

    <!-- Terminator Shadow Gradient (Darkness on the lower-left, opposite to light) -->
    <radialGradient id="terminatorShadowLeft" cx="30%" cy="72%" r="65%">
      <stop offset="0%" stop-color="#05020A" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#090414" stop-opacity="0.85" />
      <stop offset="85%" stop-color="#140827" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#140827" stop-opacity="0" />
    </radialGradient>

    <!-- Upper-Right Crescent Rim Light Highlight (Lavender / Electric Violet) -->
    <radialGradient id="rimLightGradLeft" cx="72%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#E9D5FF" stop-opacity="0.9" />
      <stop offset="12%" stop-color="#C084FC" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#7E22CE" stop-opacity="0" />
    </radialGradient>

    <!-- Atmospheric Edge Haze (Diffused rim on the lit perimeter) -->
    <linearGradient id="edgeHazeLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#6B21A8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1E0B36" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Atmospheric Glow (Subtle back-glow in space) -->
    <radialGradient id="outerAtmosphereGlowLeft" cx="65%" cy="35%" r="55%">
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.35" />
      <stop offset="90%" stop-color="#7C3AED" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Layer 1: Outer Atmospheric Back-Glow (extends slightly beyond planet edge) -->
  <circle cx="300" cy="300" r="275" fill="url(#outerAtmosphereGlowLeft)" filter="url(#rimGlowFilterLeft)" />

  <!-- Layer 2: Clipped Planet Sphere Body -->
  <g clip-path="url(#planetClipLeft)">
    <!-- Base volumetric spherical fill -->
    <circle cx="300" cy="300" r="260" fill="url(#baseSphereGradLeft)" />

    <!-- Atmospheric textured storm bands with fractal turbulence -->
    <rect x="40" y="40" width="520" height="520" fill="url(#baseSphereGradLeft)" filter="url(#planetSurfaceNoiseLeft)" opacity="0.65" />

    <!-- Secondary depth layer: subtle latitude band curves -->
    <path d="M 40,240 Q 300,320 560,240 L 560,330 Q 300,410 40,330 Z" fill="#4C1D95" opacity="0.25" />
    <path d="M 40,160 Q 300,230 560,160 L 560,220 Q 300,290 40,220 Z" fill="#6B21A8" opacity="0.2" />
    <path d="M 40,340 Q 300,420 560,340 L 560,400 Q 300,480 40,400 Z" fill="#2E1065" opacity="0.3" />

    <!-- Volumetric Terminator Shadow (Darkness on non-lit quadrant) -->
    <circle cx="300" cy="300" r="260" fill="url(#terminatorShadowLeft)" />

    <!-- High-altitude crescent illumination overlay -->
    <circle cx="300" cy="300" r="260" fill="url(#rimLightGradLeft)" />

    <!-- Inner limb darkening on the shadow side -->
    <circle cx="300" cy="300" r="260" fill="none" stroke="#05020A" stroke-width="28" opacity="0.7" />
  </g>

  <!-- Layer 3: Ultra-sharp lit crescent rim on the outer edge facing the light source -->
  <circle cx="300" cy="300" r="259" fill="none" stroke="url(#edgeHazeLeft)" stroke-width="4.5" opacity="0.9" />
  <circle cx="300" cy="300" r="258" fill="none" stroke="#F3E8FF" stroke-width="1.8" stroke-dasharray="320 1310" stroke-dashoffset="-45" opacity="0.95" />
</svg>
